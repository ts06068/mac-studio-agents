name: Validate setup code
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r gateway/requirements.txt pytest
      - run: python -m pytest -q
      - run: bash -n scripts/bootstrap.sh scripts/download-model.sh scripts/msa scripts/check-connection.sh dev/entrypoint.sh
