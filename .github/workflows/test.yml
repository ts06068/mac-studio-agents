name: Validate setup code
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r gateway/requirements.txt pytest
      - run: python -m pytest -q
      - run: for script in scripts/*.sh scripts/msa dev/entrypoint.sh; do bash -n "$script"; done
